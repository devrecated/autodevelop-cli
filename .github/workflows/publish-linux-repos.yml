# Rebuild apt + dnf repos on GitHub Pages (devrecated/packages) from release .deb/.rpm.
name: Publish Linux repos

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to index (e.g. v0.1.0). Empty = latest.
        required: false
        default: ""

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-}"
          if [ -z "$TAG" ]; then TAG="${RELEASE_TAG:-}"; fi
          if [ -z "$TAG" ]; then
            TAG=$(gh release view --json tagName -q .tagName -R devrecated/autodevelop-cli)
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download deb/rpm assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/pkgs
          gh release download "$TAG" -R devrecated/autodevelop-cli -D /tmp/pkgs -p '*.deb' -p '*.rpm' || true
          if ! ls /tmp/pkgs/*.deb >/dev/null 2>&1 && ! ls /tmp/pkgs/*.rpm >/dev/null 2>&1; then
            echo "No .deb/.rpm on release $TAG — nothing to publish"
            echo "skip=1" >> "$GITHUB_ENV"
          else
            echo "skip=0" >> "$GITHUB_ENV"
          fi

      - name: Build apt + dnf trees
        if: env.skip != '1'
        env:
          REPO_URL: https://devrecated.github.io/packages
        run: bash packaging/repo/build-pages-repos.sh /tmp/pkgs public

      - name: Checkout packages repo
        if: env.skip != '1'
        uses: actions/checkout@v7
        with:
          repository: devrecated/packages
          token: ${{ secrets.PACKAGING_TOKEN || secrets.GITHUB_TOKEN }}
          path: packages-repo

      - name: Push site to packages (main)
        if: env.skip != '1'
        working-directory: packages-repo
        env:
          GH_TOKEN: ${{ secrets.PACKAGING_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "autodevelop-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout main
          git pull --ff-only origin main || true
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name 'README.md' -exec rm -rf {} +
          cp -a ../public/. .
          git add -A
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: refresh apt/dnf for ${{ steps.tag.outputs.tag }}"
          git push origin main

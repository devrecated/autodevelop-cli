name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish npm for (e.g. v0.1.3). Leave empty for a full release from a tag push."
        required: false
        type: string
      npm_only:
        description: "Only publish npm (skip GoReleaser)"
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

jobs:
  goreleaser:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.npm_only)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN || secrets.PACKAGING_TOKEN }}
          SCOOP_TOKEN: ${{ secrets.SCOOP_TOKEN || secrets.PACKAGING_TOKEN }}

  npm:
    needs: goreleaser
    if: |
      always() && (
        (github.event_name == 'push' && needs.goreleaser.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && (inputs.npm_only || needs.goreleaser.result == 'success'))
      )
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packaging/npm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      # Trusted publishing (OIDC). Configure once on npmjs.com → package → Trusted Publisher:
      #   Organization: devrecated  Repository: autodevelop-cli  Workflow: release.yml
      # NPM_TOKEN is a fallback only; prefer OIDC (npm ≥ 11.5.1).
      - uses: actions/setup-node@v7
        with:
          node-version: "22.14"
          registry-url: https://registry.npmjs.org

      - name: Publish npm package
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          VER: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VER="${VER#v}"
          if ! [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "Refusing to publish with version '$VER' (expected semver from tag)." >&2
            exit 1
          fi
          if [ -n "${NPM_TOKEN:-}" ]; then
            export NODE_AUTH_TOKEN="$NPM_TOKEN"
          fi
          unset NPM_TOKEN
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8')); p.version=process.env.VER; fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\n')"
          npm install -g npm@^11.5.1
          npm publish --provenance --access public
          npm view "@devrecated/autodevelop@${VER}" version
